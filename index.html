<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Panel de compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f1f5f9; --panel: #fff; --texto: #0f172a; --suave: #475569; --tenue: #94a3b8; --borde: #e2e8f0;
    --acento: #1e40af; --acento2: #3b82f6; --acento-bg: #dbeafe; --ambar: #b45309; --ambar-bg: #fef3c7;
    --rojo: #b91c1c; --rojo-bg: #fee2e2; --verde: #047857; --verde-bg: #d1fae5; --hover: #f8fafc; --abierta: #eff6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #0b1120; --panel: #111827; --texto: #e2e8f0; --suave: #94a3b8; --tenue: #64748b; --borde: #1f2937;
      --acento: #93c5fd; --acento2: #60a5fa; --acento-bg: #1e3a8a55; --ambar: #fbbf24; --ambar-bg: #78350f55;
      --rojo: #fca5a5; --rojo-bg: #7f1d1d55; --verde: #6ee7b7; --verde-bg: #064e3b55; --hover: #1e293b; --abierta: #172554; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13px/1.35 "Fira Sans", system-ui, sans-serif; background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .n { font-family: "Fira Code", ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 12px; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--acento2); outline-offset: 1px; }

  /* Barra superior: titulo, pestañas y actualizar en una sola linea */
  header { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--borde); }
  h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 2px; background: var(--fondo); padding: 2px; border-radius: 8px; overflow-x: auto; scrollbar-width: none; }
  nav button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; color: var(--suave); font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
  nav button:hover { color: var(--texto); }
  nav button[aria-selected="true"] { background: var(--panel); color: var(--acento); box-shadow: 0 1px 2px #0002; }
  .der { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #hora { color: var(--tenue); font-size: 12px; white-space: nowrap; }
  .icono { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--borde); background: var(--panel); border-radius: 7px; color: var(--suave); }
  .icono:hover { color: var(--acento); border-color: var(--acento2); }
  .icono svg { width: 16px; height: 16px; }
  .icono.girando svg { animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }

  /* Filtros */
  #filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; }
  #filtros:empty { display: none; }
  #totales { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 10px 8px; color: var(--suave); }
  #totales:empty { display: none; }
  #totales b { color: var(--texto); }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--suave); white-space: nowrap; transition: background .15s; }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { background: var(--acento-bg); color: var(--acento); font-weight: 600; }
  .seg small { display: block; font-size: 11px; font-weight: 400; color: var(--tenue); }
  .seg button[aria-pressed="true"] small { color: var(--acento2); }
  /* General / Por factura: botones del ancho de su texto, centrados y separados */
  .sub { display: flex; justify-content: center; gap: 10px; margin: 4px 0 6px; }
  .sub button { border: 1px solid var(--borde); background: var(--panel); padding: 4px 14px; border-radius: 999px; color: var(--suave); white-space: nowrap; transition: background .15s; }
  .sub button:hover { background: var(--hover); }
  .sub button[aria-pressed="true"] { background: var(--acento-bg); border-color: var(--acento); color: var(--acento); font-weight: 600; }
  select, input[type="date"] { height: 30px; padding: 0 8px; background: var(--panel); border: 1px solid var(--borde); border-radius: 7px; max-width: 190px; }
  .buscar { position: relative; flex: 1 1 160px; }
  .buscar svg { position: absolute; left: 8px; top: 8px; width: 14px; height: 14px; color: var(--tenue); }
  .buscar input { width: 100%; height: 30px; padding: 0 8px 0 28px; background: var(--panel); border: 1px solid var(--borde); border-radius: 7px; }

  /* Tabla: ocupa el resto de la pantalla y es lo unico que desplaza */
  #caja { flex: 1; min-height: 0; margin: 0 10px 8px; background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; overflow: auto; }
  #caja:empty { display: none; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: 5px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--borde); }
  th { position: sticky; top: 0; z-index: 2; background: var(--panel); color: var(--suave); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; }
  th:hover { color: var(--acento); }
  th .flecha { color: var(--acento2); }
  .der-al { text-align: right; }
  tbody tr.fila { transition: background .12s; }
  tbody tr.fila:hover { background: var(--hover); }
  tbody tr.fila.con { cursor: pointer; }
  tbody tr.fila.abierta { background: var(--abierta); }
  td.prim { font-weight: 500; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .chev { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; color: var(--tenue); transition: transform .15s; }
  tr.abierta .chev { transform: rotate(90deg); color: var(--acento); }
  tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--panel); font-weight: 600; border-top: 1px solid var(--borde); border-bottom: 0; }
  .vacio { text-align: center; color: var(--tenue); padding: 24px; }

  /* Detalle desplegado */
  tr.det > td { background: var(--abierta); padding: 4px 10px 10px 26px; white-space: normal; }
  .grilla { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 2px 0 6px; color: var(--suave); }
  .grilla b { color: var(--texto); font-weight: 500; }
  .mini { border-collapse: collapse; width: auto; min-width: min(100%, 420px); background: var(--panel); border-radius: 6px; overflow: hidden; }
  .mini th, .mini td { position: static; padding: 3px 8px; font-size: 12px; border-bottom: 1px solid var(--borde); cursor: default; }
  .titulo-det { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--tenue); margin: 6px 0 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--borde); font-size: 12px; }
  .chip .n { color: var(--suave); font-size: 11px; }
  /* Factura o pago dentro de un desplegable: una linea que se abre con sus productos */
  details.it { background: var(--panel); border: 1px solid var(--borde); border-radius: 6px; margin: 4px 0; }
  details.it > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 4px 8px; cursor: pointer; list-style: none; }
  details.it > summary::-webkit-details-marker { display: none; }
  details.it > summary:hover { background: var(--hover); }
  details.it[open] > summary .chev { transform: rotate(90deg); color: var(--acento); }
  details.it > div { padding: 2px 8px 8px; }
  details.it .mini { border: 1px solid var(--borde); }

  .tag { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 11px; font-weight: 500; line-height: 18px; }
  .t-rojo { color: var(--rojo); background: var(--rojo-bg); }
  .t-verde { color: var(--verde); background: var(--verde-bg); }
  .t-ambar { color: var(--ambar); background: var(--ambar-bg); }
  .t-azul { color: var(--acento); background: var(--acento-bg); }
  .rojo { color: var(--rojo); } .tenue { color: var(--tenue); }

  #aviso { margin: 40px 16px; text-align: center; color: var(--suave); }

  /* Lecturas: formulario de correccion dentro del desplegable */
  .form { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  .campos { display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .campos label, .renglon label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--suave); }
  .form input, .form select { height: 30px; padding: 0 8px; background: var(--panel); border: 1px solid var(--borde); border-radius: 7px; min-width: 0; max-width: none; }
  .form input.num { text-align: right; font-family: "Fira Code", ui-monospace, monospace; font-size: 12px; }
  .campos .ancho { flex: 1 1 220px; } .campos .medio { flex: 0 1 150px; }
  .renglon { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 8px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--borde); border-radius: 7px; }
  .renglon .leido { flex-basis: 100%; font-size: 11px; color: var(--tenue); }
  .renglon .prod { flex: 1 1 220px; } .renglon .cant { flex: 0 1 80px; } .renglon .uni { flex: 0 1 70px; } .renglon .sub { flex: 0 1 110px; }
  .renglon.dudoso { border-color: var(--ambar); }
  .nuevo { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ambar); height: 30px; }
  .nuevo[hidden] { display: none; }
  .quitar { border: 0; background: none; color: var(--tenue); height: 30px; width: 30px; border-radius: 6px; }
  .quitar:hover { color: var(--rojo); background: var(--rojo-bg); }
  .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .boton { border: 1px solid var(--borde); background: var(--panel); padding: 5px 12px; border-radius: 7px; color: var(--suave); }
  .boton:hover { border-color: var(--acento2); color: var(--acento); }
  .boton.primario { background: var(--acento); border-color: var(--acento); color: var(--panel); font-weight: 600; }
  .boton.primario:hover { background: var(--acento2); color: #fff; }
  .boton:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--rojo); font-weight: 500; }
  .contador { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--ambar-bg); color: var(--ambar); font-size: 11px; line-height: 16px; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--texto); color: var(--panel); padding: 8px 14px; border-radius: 8px; z-index: 10; max-width: calc(100% - 32px); }

  /* Celular: menos columnas; lo demas esta en el detalle */
  @media (max-width: 700px) {
    header { flex-wrap: wrap; row-gap: 6px; }
    nav { order: 3; width: 100%; }
    nav button { flex: 1; padding: 6px 4px; }
    .opt { display: none; }
    td.prim { max-width: 150px; }
    select { max-width: 48%; flex: 1; }
    .seg { width: 100%; } .seg button { flex: 1; padding: 4px 4px; }
    #caja { margin: 0 6px 6px; }
    tr.det > td { padding: 4px 6px 8px; }
    .mini { min-width: 0; width: 100%; }
    .mini th, .mini td { white-space: normal; padding: 3px 4px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Compras</h1>
  <nav role="tablist" aria-label="Secciones">
    <button role="tab" data-tab="facturas">Facturas</button>
    <button role="tab" data-tab="pagos">Pagos</button>
    <button role="tab" data-tab="proveedores">Proveedores</button>
    <button role="tab" data-tab="productos">Productos</button>
    <button role="tab" data-tab="lecturas">Lecturas</button>
  </nav>
  <div class="der">
    <span id="hora"></span>
    <button id="actualizar" class="icono" type="button" aria-label="Actualizar datos" title="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>
<div id="filtros"></div>
<div id="totales" role="status" aria-live="polite" aria-label="Totales con los filtros actuales"></div>
<div id="caja"></div>
<p id="aviso" hidden></p>
<div id="toast" role="status" hidden></div>
<datalist id="dl-productos"></datalist>

<script>
'use strict';
const API = 'https://bot-compras-ildola67nq-uc.a.run.app/panel/datos';
const CLAVE = 'panel-compras-token';

// --- Token: llega en el link (#t=...) y queda guardado en este navegador. ---
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const leerGuardado = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const enLink = new URLSearchParams(location.hash.slice(1)).get('t');
if (enLink) { guardar(CLAVE, enLink); history.replaceState(null, '', location.pathname); }
let token = enLink || leerGuardado(CLAVE);

// --- Formato ---
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gs = (n) => Math.round(Number(n) || 0).toLocaleString('es-PY');
const corto = (n) => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toLocaleString('es-PY', { maximumFractionDigits: 1 }) + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' mil' : gs(n); };
const cant = (n) => (Number(n) || 0).toLocaleString('es-PY', { maximumFractionDigits: 2 });
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIA = 86400000;
function fecha(texto) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(texto ?? '').trim());
  return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : null;
}
const hoy = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
const mesDe = (texto) => { const d = fecha(texto); if (d == null) return ''; const x = new Date(d); return `${x.getUTCFullYear()}-${String(x.getUTCMonth() + 1).padStart(2, '0')}`; };
const nombreMes = (clave) => { const [a, m] = clave.split('-'); return `${MESES[+m - 1]} ${a}`; };
const dias = (texto) => { const d = fecha(texto); return d == null ? '' : Math.round((hoy() - d) / DIA); };
const unicos = (lista) => [...new Set(lista.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'es'));
const clave = (s) => String(s ?? '').trim().toUpperCase();
const ICONO_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const ICONO_BUSCAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

// --- Estado de la vista ---
let datos = null;
const vista = { tab: leerGuardado('panel-compras-tab') || 'facturas', filtros: {}, orden: {}, abiertos: new Set(), sub: {} };
const f = (k, defecto = '') => vista.filtros[vista.tab + k] ?? defecto;

// --- Controles ---
function seg(k, opciones, defecto) {
  const actual = f(k, defecto);
  return `<div class="seg" role="group">${opciones.map(([v, t, sub]) =>
    `<button type="button" data-seg="${k}" data-v="${esc(v)}" aria-pressed="${v === actual}">${esc(t)}${sub != null ? `<small class="n">${esc(sub)}</small>` : ''}</button>`).join('')}</div>`;
}
function select(k, etiqueta, valores, formato = (v) => v) {
  const actual = f(k);
  return `<select data-f="${k}" aria-label="${esc(etiqueta)}"><option value="">${esc(etiqueta)}</option>${valores.map((v) =>
    `<option value="${esc(v)}"${v === actual ? ' selected' : ''}>${esc(formato(v))}</option>`).join('')}</select>`;
}
const buscar = (texto = 'Buscar') => `<label class="buscar">${ICONO_BUSCAR}<input type="search" data-f="q" placeholder="${esc(texto)}..." value="${esc(f('q'))}" aria-label="${esc(texto)}"></label>`;
const coincide = (fila, campos) => {
  const q = f('q').trim().toLowerCase();
  return !q || campos.some((c) => String(Array.isArray(fila[c]) ? fila[c].join(' ') : fila[c] ?? '').toLowerCase().includes(q));
};
const resumen = (lista, campo) => `${lista.length} · ${corto(lista.reduce((s, x) => s + (Number(x[campo]) || 0), 0))}`;
const tabla = (cabeza, filas) => `<table class="mini"><thead><tr>${cabeza.map(([t, d]) => `<th${d ? ' class="der-al"' : ''}>${esc(t)}</th>`).join('')}</tr></thead><tbody>${filas.join('')}</tbody></table>`;

// Por proveedor (una fila por proveedor, sus facturas o pagos en el desplegable) o cronologico (una fila por cada uno).
const MODOS = [['proveedor', 'Por proveedor'], ['fecha', 'Cronológico']];
const modo = () => f('vista', leerGuardado('panel-compras-vista-' + vista.tab) || 'fecha');
// Un grupo por proveedor; el que tiene uno solo queda como esa fila.
function agrupar(lista, armar) {
  const grupos = new Map();
  for (const x of lista) { const k = clave(x.proveedor); grupos.has(k) ? grupos.get(k).push(x) : grupos.set(k, [x]); }
  return [...grupos.values()].map((g) => g.length === 1 ? g[0] : { ...armar(g), id: 'g:' + clave(g[0].proveedor), proveedor: g[0].proveedor, grupo: g });
}
const masNueva = (lista, k) => lista.reduce((m, x) => (fecha(x[k]) ?? -1) > (fecha(m) ?? -1) ? x[k] : m, '');
const nuevaPrimero = (lista) => lista.slice().sort((a, b) => (fecha(b.fecha) ?? 0) - (fecha(a.fecha) ?? 0));
const sumar = (lista, k) => lista.reduce((s, x) => s + (Number(x[k]) || 0), 0);
// Los desplegables internos recuerdan si estaban abiertos (data-k) aunque se redibuje la tabla.
const internos = new Set();
const desplegable = (k, resumenHtml, cuerpo) =>
  `<details class="it" data-k="${esc(k)}"${internos.has(k) ? ' open' : ''}><summary>${ICONO_CHEV}${resumenHtml}</summary><div>${cuerpo}</div></details>`;
const tagFactura = (fa) => fa.pagada ? '<span class="tag t-verde">Pagada</span>'
  : ((d) => `<span class="tag ${d > 30 ? 't-rojo' : d > 15 ? 't-ambar' : 't-azul'}">${d} d</span>`)(dias(fa.fecha) || 0);
const renglonesTabla = (renglones) => renglones.length ? tabla([['Producto'], ['Cantidad', 1], ['Subtotal', 1]], renglones.map((i) =>
  `<tr><td>${esc(i.producto)}${i.sinAsignar ? ' <span class="tag t-ambar">sin asignar</span>' : ''}</td><td class="der-al n">${cant(i.cantidad)} ${esc(i.unidad)}</td><td class="der-al n">${gs(i.subtotal)}</td></tr>`))
  : '<span class="tenue">Sin renglones cargados.</span>';
const detalleFactura = (fa) => `<div class="grilla"><span>Número <b>${esc(fa.numero)}</b></span><span>Medio <b>${esc(fa.medio || '—')}</b></span>
  <span>Local <b>${esc(fa.local || '—')}</b></span>${fa.pagada ? `<span>Pagada <b>${esc(fa.fecha_pago || '—')}</b></span>` : ''}</div>
  ${renglonesTabla(datos.items.filter((i) => i.factura === fa.id))}`;
const facturaDesplegable = (fa, conProveedor) => desplegable('f:' + fa.id,
  `<span class="n">${esc(fa.fecha)}</span>${conProveedor ? `<b>${esc(fa.proveedor)}</b>` : ''}<span>${esc(fa.numero)}</span><span class="n">${gs(fa.total)}</span>${tagFactura(fa)}`,
  detalleFactura(fa));

// Columna: { k, t, tipo: texto|gs|num|fecha|dias, opt (se oculta en celular), html (celda propia) }
const TABS = {
  facturas() {
    const lista = datos.facturas;
    const estado = f('estado', 'no');
    const base = lista.filter((x) => (!f('proveedor') || x.proveedor === f('proveedor')) && (!f('mes') || mesDe(x.fecha) === f('mes')) &&
      (!f('local') || x.local === f('local')) && coincide(x, ['proveedor', 'numero', 'medio', 'local']));
    const no = base.filter((x) => !x.pagada), si = base.filter((x) => x.pagada);
    const filtros = [
      seg('vista', MODOS, modo()),
      seg('estado', [['no', 'No pagadas', resumen(no, 'total')], ['si', 'Pagadas', resumen(si, 'total')], ['', 'Todas', resumen(base, 'total')]], 'no'),
      select('proveedor', 'Proveedor', unicos(lista.map((x) => x.proveedor))),
      select('mes', 'Mes', unicos(lista.map((x) => mesDe(x.fecha))).reverse(), nombreMes),
      select('local', 'Local', unicos(lista.map((x) => x.local))),
      buscar('Buscar factura'),
    ];

  const nombres = conocido();
  for (const i of b.items) {
    if (!String(i.producto).trim()) return 'Falta el producto en un renglón.';
    if (!nombres.has(clave(i.producto)) && !i.nuevo) return `"${i.producto}" no existe: marcá "Crear producto nuevo" o elegí uno de la lista.`;
  }
  if (!b.proveedor) return 'Elegí el proveedor.';
  return { id: l.id, version: l.version, pagoId: b.pagoId || undefined, factura: { fecha: b.fecha.trim(), proveedor: b.proveedor, numero: String(b.numero).trim(),
    total: numeroOVacio(b.total), items: b.items.map((i) => ({ ...(i.indice != null ? { indice: i.indice } : {}), producto: String(i.producto).trim(),
      ...(i.nuevo ? { nuevo: true } : {}), cantidad: numeroOVacio(i.cantidad, false), unidad: String(i.unidad ?? '').trim(), subtotal: numeroOVacio(i.subtotal) })) } };
}
function toast(texto) {
  const t = document.getElementById('toast'); t.textContent = texto; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4000);
}
async function guardarLectura(boton) {
  const l = datos.lecturas.find((x) => x.id === boton.dataset.guardar), b = l && borradores.get(l.id);
  if (!b) return;
  const cuerpo = cuerpoLectura(l, b);
  if (typeof cuerpo === 'string') { b.error = cuerpo; return dibujar(); }
  boton.disabled = true; boton.textContent = 'Guardando...';
  try {
    const r = await fetch(API_LECTURA, { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    const respuesta = await r.json().catch(() => ({}));
    if (r.status === 401) { b.error = 'El link venció o no tenés permiso. Pedí uno nuevo con /panel.'; return dibujar(); }
    if (!r.ok) { b.error = respuesta.error || 'No se pudo guardar. Probá de nuevo en un rato.'; return dibujar(); }
    borradores.delete(l.id); vista.abiertos.delete('lecturas:' + l.id);
    toast('Factura cargada en el libro.');
    await cargar();
  } catch {
    b.error = 'Sin conexión. No se guardó; probá de nuevo.'; dibujar();
  }
}
// Escribir solo actualiza el borrador (sin redibujar: no se pierde el foco).
function alEscribir(e) {
  const el = e.target, l = el.dataset?.l, c = el.dataset?.c;
  if (!l || !c || !borradores.has(l)) return;
  const b = borradores.get(l), r = el.dataset.r;
  const destino = r != null ? b.items[+r] : b;
  destino[c] = el.type === 'checkbox' ? el.checked : el.value;
  b.error = '';
  if (c === 'producto') {
    const nuevo = el.value.trim() && !conocido().has(clave(el.value));
    const marca = el.closest('.renglon').querySelector('.nuevo');
    marca.hidden = !nuevo; el.closest('.renglon').classList.toggle('dudoso', !el.value.trim() || nuevo);
  }
  if (c === 'total' || c === 'subtotal') { const d = caja.querySelector(`[data-dif="${CSS.escape(l)}"]`); if (d) d.textContent = textoDiferencia(b); }
  if (c === 'proveedor' && e.type === 'change') { if (!pagosPara(b).some((p) => p.id === b.pagoId)) b.pagoId = ''; dibujar(); }
}

// --- Tabla principal ---
function valorOrden(fila, c) {
  if (c.tipo === 'fecha') return fecha(fila[c.k]) ?? -Infinity;
  if (['gs', 'num', 'orden'].includes(c.tipo)) return Number(fila[c.k]) || 0;
  return String(fila[c.k] ?? '').toLowerCase();
}
function celda(x, c, primera, conDetalle) {
  const clase = [c.opt ? 'opt' : '', ['gs', 'num'].includes(c.tipo) ? 'der-al' : '', primera ? 'prim' : ''].filter(Boolean).join(' ');
  const v = x[c.k];
  const contenido = c.html ? c.html(x) : c.tipo === 'gs' ? `<span class="n">${gs(v)}</span>` : c.tipo === 'num' ? `<span class="n">${v === '' ? '' : cant(v)}</span>` : esc(v);
  return `<td${clase ? ` class="${clase}"` : ''}${primera ? ` title="${esc(v)}"` : ''}>${primera && conDetalle ? ICONO_CHEV : ''}${contenido}</td>`;
}

// Usa los documentos filtrados: agrupar por proveedor no duplica ni oculta importes.
function totalesVista(filas) {
  const registros = filas.flatMap((x) => x.grupo ?? [x]);
  const nombres = { facturas: 'facturas', pagos: 'pagos', proveedores: 'proveedores', productos: 'productos', lecturas: 'lecturas' };
  const etiquetas = [`<span><b>${registros.length}</b> ${nombres[vista.tab]} con estos filtros</span>`];
  const importe = (titulo, total) => etiquetas.push(`<span>${titulo}: <b class="n">G. ${gs(total)}</b></span>`);
  if (vista.tab === 'facturas') {
    importe('Total facturado', sumar(registros, 'total'));
    importe('Pendiente', sumar(registros.filter((x) => !x.pagada), 'total'));
  } else if (vista.tab === 'pagos') {
    importe('Total pagado', sumar(registros, 'monto'));
    importe('Saldo pendiente de documentar', registros.reduce((s, x) => s + Math.max(Number(x.saldo) || 0, 0), 0));
  } else if (vista.tab === 'proveedores') {
    importe('Comprado', sumar(registros, 'total'));
    importe('Deuda', sumar(registros, 'deuda'));
    importe('Saldo pendiente de documentar', sumar(registros, 'saldoFavor'));
  } else if (vista.tab === 'productos') {
    importe('Gasto', sumar(registros, 'gasto'));
    const unidades = new Map();
    for (const p of registros) for (const i of p.compras) {
      const unidad = clave(i.unidad) || 'SIN UNIDAD';
      unidades.set(unidad, (unidades.get(unidad) ?? 0) + (Number(i.cantidad) || 0));
    }
    if (unidades.size) etiquetas.push(`<span>Cantidades: <b>${[...unidades].map(([u, n]) => `${cant(n)} ${esc(u)}`).join(' · ')}</b></span>`);
  } else importe('Total por revisar', sumar(registros, 'total'));
  return etiquetas.join('');
}

function dibujar() {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === vista.tab)));
  if (!datos) return;
  const n = datos.lecturas.length;
  document.querySelector('[data-tab="lecturas"]').innerHTML = `Lecturas${n ? `<span class="contador">${n}</span>` : ''}`;
  const { filtros, filas, columnas, suma, orden, id, detalle } = TABS[vista.tab]();
  document.getElementById('totales').innerHTML = totalesVista(filas);
  const [k, sentido] = vista.orden[vista.tab] ?? orden;
  const col = columnas.find((c) => c.k === k) ?? columnas[0];
  filas.sort((a, b) => { const x = valorOrden(a, col), y = valorOrden(b, col); return (x < y ? -1 : x > y ? 1 : 0) * sentido; });
  const activo = document.activeElement?.dataset?.f;
  document.getElementById('filtros').innerHTML = filtros.join('');
  if (activo) { const el = document.querySelector(`[data-f="${activo}"]`); el?.focus(); if (el?.type === 'search') el.setSelectionRange(el.value.length, el.value.length); }
  const total = filas.reduce((s, x) => s + (Number(x[suma]) || 0), 0);
  const visibles = columnas.length;
  const cuerpo = filas.map((x) => {
    const clave = vista.tab + ':' + id(x), abierta = vista.abiertos.has(clave);
    return `<tr class="fila con${abierta ? ' abierta' : ''}" data-id="${esc(clave)}" tabindex="0" aria-expanded="${abierta}">${columnas.map((c, i) => celda(x, c, i === 0, true)).join('')}</tr>` +
      (abierta ? `<tr class="det"><td colspan="${visibles}">${detalle(x)}</td></tr>` : '');
  }).join('');
  document.getElementById('caja').innerHTML = `<table>
    <thead><tr>${columnas.map((c) => `<th data-orden="${c.k}" class="${[c.opt ? 'opt' : '', ['gs', 'num'].includes(c.tipo) ? 'der-al' : ''].join(' ')}">${esc(c.t)}${c.k === col.k ? `<span class="flecha"> ${sentido > 0 ? '↑' : '↓'}</span>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${cuerpo || `<tr><td colspan="${visibles}" class="vacio">Nada con estos filtros.</td></tr>`}</tbody>
    <tfoot><tr>${columnas.map((c, i) => `<td class="${[c.opt ? 'opt' : '', c.k === suma ? 'der-al' : ''].join(' ')}">${i === 0 ? `${filas.length} ${filas.length === 1 ? 'fila' : 'filas'}` : c.k === suma ? `<span class="n">${gs(total)}</span>` : ''}</td>`).join('')}</tr></tfoot>
  </table>`;
}

// --- Eventos (delegados, registrados una vez) ---
document.querySelector('nav').addEventListener('click', (e) => {
  const tab = e.target.closest('button')?.dataset.tab;
  if (!tab || tab === vista.tab) return;
  vista.tab = tab; guardar('panel-compras-tab', tab);
  document.getElementById('caja').scrollTop = 0;
  dibujar();
});
const filtrosEl = document.getElementById('filtros');
const alCambiar = (e) => { const k = e.target.dataset.f; if (!k) return; vista.filtros[vista.tab + k] = e.target.value; dibujar(); };
filtrosEl.addEventListener('input', alCambiar);
filtrosEl.addEventListener('change', alCambiar);
filtrosEl.addEventListener('click', (e) => {
  const b = e.target.closest('[data-seg]');
  if (!b) return;
  vista.filtros[vista.tab + b.dataset.seg] = b.dataset.v;
  if (b.dataset.seg === 'vista') guardar('panel-compras-vista-' + vista.tab, b.dataset.v);
  dibujar();
});
const caja = document.getElementById('caja');
function alternar(tr) {
  const k = tr.dataset.id;
  vista.abiertos.has(k) ? vista.abiertos.delete(k) : vista.abiertos.add(k);
  dibujar();
  caja.querySelector(`tr[data-id="${CSS.escape(k)}"]`)?.focus({ preventScroll: true });
}
caja.addEventListener('click', (e) => {
  const th = e.target.closest('th[data-orden]');
  if (th && th.closest('table') === caja.firstElementChild) {
    const [actual, sentido] = vista.orden[vista.tab] ?? [];
    vista.orden[vista.tab] = [th.dataset.orden, actual === th.dataset.orden ? -sentido : -1];
    return dibujar();
  }
  const sub = e.target.closest('[data-sub]');
  if (sub) { vista.sub[sub.dataset.id] = sub.dataset.sub; return dibujar(); }
  const boton = e.target.closest('button[data-l], button[data-guardar], button[data-descartar]');
  if (boton) {
    if (boton.dataset.guardar) return guardarLectura(boton);
    if (boton.dataset.descartar) { borradores.delete(boton.dataset.descartar); return dibujar(); }
    const b = borradores.get(boton.dataset.l);
    if (!b) return;
    if (boton.dataset.alt) Object.assign(b.items[+boton.dataset.r], { producto: boton.dataset.alt, nuevo: false });
    else if (boton.dataset.quitar != null) b.items.splice(+boton.dataset.quitar, 1);
    else if (boton.hasAttribute('data-agregar')) b.items.push({ texto: '', alternativas: [], producto: '', nuevo: false, cantidad: '', unidad: '', subtotal: '' });
    return dibujar();
  }
  const tr = e.target.closest('tr.fila');
  if (tr) alternar(tr);
});
// toggle no burbujea: se escucha en captura.
caja.addEventListener('toggle', (e) => { const k = e.target.dataset?.k; if (k) e.target.open ? internos.add(k) : internos.delete(k); }, true);
caja.addEventListener('input', alEscribir);
caja.addEventListener('change', alEscribir);
caja.addEventListener('keydown', (e) => {
  const tr = e.target.closest?.('tr.fila');
  if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); alternar(tr); }
});

// --- Datos ---
function avisar(texto) { const a = document.getElementById('aviso'); a.textContent = texto; a.hidden = !texto; }
async function cargar() {
  if (!token) return avisar('Pedí el link del panel con /panel en el chat privado del bot.');
  const boton = document.getElementById('actualizar');
  boton.disabled = true; boton.classList.add('girando');
  try {
    const r = await fetch(API, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
    if (r.status === 401) {
      guardar(CLAVE, null); token = null; datos = null;
      document.getElementById('caja').innerHTML = ''; document.getElementById('filtros').innerHTML = ''; document.getElementById('totales').innerHTML = '';
      return avisar('El link venció o no tenés permiso. Pedí uno nuevo con /panel en el chat privado del bot.');
    }
    if (!r.ok) throw new Error(r.status);
    datos = await r.json();
    datos.catalogo ??= [];
    datos.lecturas ??= [];
    // Lecturas que ya no estan en REVISAR: su borrador ya no sirve.
    for (const id of borradores.keys()) if (!datos.lecturas.some((l) => l.id === id)) borradores.delete(id);
    document.getElementById('dl-productos').innerHTML = unicos([...datos.catalogo.map((c) => c.producto), ...datos.proveedores.flatMap((p) => p.productos)])
      .map((p) => `<option value="${esc(p)}">`).join('');
    avisar('');
    document.getElementById('hora').textContent = new Date(datos.actualizado).toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit' });
    dibujar();
  } catch {
    avisar(datos ? '' : 'No se pudieron traer los datos. Probá actualizar en un rato.');
    if (datos) document.getElementById('hora').textContent += ' · sin conexión';
  } finally { boton.disabled = false; boton.classList.remove('girando'); }
}
document.getElementById('actualizar').addEventListener('click', cargar);
// No se recarga mientras alguien escribe en un formulario de Lecturas.
setInterval(() => { if (!document.hidden && !document.activeElement?.closest?.('.form')) cargar(); }, 120000);
dibujar();
cargar();
</script>
